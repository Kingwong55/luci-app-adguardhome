name: Build IPK

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          path: luci-app-adguardhome

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang flex bison g++ gawk gcc-multilib \
            gettext git libncurses-dev libssl-dev python3-setuptools rsync swig \
            unzip zlib1g-dev file wget zstd

      - name: Download SDK
        run: |
          wget -q "https://downloads.immortalwrt.org/releases/24.10.1/targets/x86/64/immortalwrt-sdk-24.10.1-x86-64_gcc-13.3.0_musl.Linux-x86_64.tar.zst" -O sdk.tar.zst
          mkdir sdk
          tar --zstd -xf sdk.tar.zst --strip-components=1 -C sdk

      - name: Prepare feed
        run: |
          mkdir -p feed/luci-app-adguardhome
          cp -r luci-app-adguardhome/* feed/luci-app-adguardhome/

      - name: Setup feeds
        run: |
          cd sdk
          echo "src-link customfeed ${{ github.workspace }}/feed" > feeds.conf
          cat feeds.conf.default >> feeds.conf
          ./scripts/feeds update -a
          ./scripts/feeds install luci-app-adguardhome

      - name: Build po2lmo tool
        run: |
          cd sdk
          make package/luci-base/host/compile V=s -j$(nproc) 2>/dev/null || true
          # Fallback: build po2lmo from source if not found
          if ! command -v po2lmo &>/dev/null && ! ls staging_dir/host/bin/po2lmo 2>/dev/null; then
            if [ -d feeds/luci/modules/luci-base/src ]; then
              cd feeds/luci/modules/luci-base/src
              gcc -o po2lmo po2lmo.c -I. 2>/dev/null || gcc -o po2lmo po2lmo.c 2>/dev/null || true
              if [ -f po2lmo ]; then
                cp po2lmo $GITHUB_WORKSPACE/sdk/staging_dir/host/bin/
              fi
              cd $GITHUB_WORKSPACE/sdk
            fi
          fi
          export PATH="$GITHUB_WORKSPACE/sdk/staging_dir/host/bin:$PATH"

      - name: Build
        run: |
          cd sdk
          export PATH="$GITHUB_WORKSPACE/sdk/staging_dir/host/bin:$PATH"
          make defconfig
          make package/luci-app-adguardhome/compile V=s -j$(nproc) || make package/luci-app-adguardhome/compile V=s -j1

      - name: Collect packages
        run: |
          mkdir -p output
          find sdk/bin/ -name "luci-*adguardhome*.ipk" -exec cp {} output/ \;
          find sdk/bin/ -name "luci-*AdGuardHome*.ipk" -exec cp {} output/ \;
          ls -la output/

      - name: Upload to Release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: output/*

      - name: Upload Artifact
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: luci-app-adguardhome-packages
          path: output/*
