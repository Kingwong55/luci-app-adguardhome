name: Build IPK

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          path: luci-app-adguardhome

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang flex bison g++ gawk gcc-multilib \
            gettext git libncurses-dev libssl-dev python3-setuptools rsync swig \
            unzip zlib1g-dev file wget zstd

      - name: Download SDK
        run: |
          wget -q "https://downloads.immortalwrt.org/releases/24.10.1/targets/x86/64/immortalwrt-sdk-24.10.1-x86-64_gcc-13.3.0_musl.Linux-x86_64.tar.zst" -O sdk.tar.zst
          mkdir sdk
          tar --zstd -xf sdk.tar.zst --strip-components=1 -C sdk

      - name: Prepare feed
        run: |
          mkdir -p feed/luci-app-adguardhome
          cp -r luci-app-adguardhome/* feed/luci-app-adguardhome/

      - name: Setup feeds
        run: |
          cd sdk
          echo "src-link customfeed ${{ github.workspace }}/feed" > feeds.conf
          cat feeds.conf.default >> feeds.conf
          ./scripts/feeds update -a
          ./scripts/feeds install luci-app-adguardhome

      - name: Build po2lmo tool
        run: |
          cd sdk
          echo "=== Searching for po2lmo source files ==="
          find feeds/luci -name "po2lmo.c" -o -name "sfh_hash.c" -o -name "template_lmo.h" | sort
          PO2LMO_C=$(find feeds/luci -name "po2lmo.c" | head -n 1)
          SFH_C=$(find feeds/luci -name "sfh_hash.c" | head -n 1)
          HEADER_DIR=$(find feeds/luci -name "template_lmo.h" -printf "%h\n" | head -n 1)
          echo "po2lmo.c: $PO2LMO_C"
          echo "sfh_hash.c: $SFH_C"
          echo "header dir: $HEADER_DIR"
          mkdir -p staging_dir/host/bin
          gcc -o staging_dir/host/bin/po2lmo "$PO2LMO_C" "$SFH_C" -I"$HEADER_DIR"
          ls -la staging_dir/host/bin/po2lmo
          echo "$(pwd)/staging_dir/host/bin" >> $GITHUB_PATH

      - name: Build
        run: |
          cd sdk
          make defconfig
          make package/luci-app-adguardhome/compile V=s -j$(nproc) || make package/luci-app-adguardhome/compile V=s -j1

      - name: Collect packages
        run: |
          mkdir -p output
          find sdk/bin/ -name "luci-*adguardhome*.ipk" -exec cp {} output/ \;
          find sdk/bin/ -name "luci-*AdGuardHome*.ipk" -exec cp {} output/ \;
          ls -la output/

      - name: Upload to Release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: output/*

      - name: Upload Artifact
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: luci-app-adguardhome-packages
          path: output/*
